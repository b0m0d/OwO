[package]
name = "owo-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
owo-agent-core.workspace = true
owo-agent-server.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline = "14"
colored = "2"
uuid.workspace = true
reqwest.workspace = true
ratatui = "0.29"
crossterm = "0.28"

[[bin]]
name = "owo-agent"
path = "src/main.rs"

# product-eval preflight 的磁盘剩余空间检查（GetDiskFreeSpaceExW，仅 Windows）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
