[package]
name = "owo-agent-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

# 独立于 agent-sdk workspace：避免 tauri 重依赖拖慢核心构建。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
winreg = "0.55"
# §6.1.2/§6.1.4：共享构建身份 crate（与 core 同一编译期烧录实现），
# 壳据此比对 core_ready 上报的 build_id 是否与本安装包期望一致。
owo-build-info = { path = "../../../crates/owo-build-info" }
rfd = "0.15"

# §4.1 单实例命名管道（OwO-Agent-Desktop）：Windows 专属；0.61 与锁文件现有
# windows-sys 传递依赖同版本，离线可复用缓存，不引入新 crate。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
incremental = true
